name: Terraform validation and security

on:
  pull_request:
    paths:
      - "terraform/**.tf"
      - "terraform/.terraform.lock.hcl"
      - ".github/workflows/terraform-review-simple.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Validate and scan Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform for validation
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      # Advisory while this demo intentionally contains an open SSH rule.
      # Remove continue-on-error to make HIGH/CRITICAL findings block the PR.
      - name: Scan Terraform security with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "terraform"
          format: "table"
          hide-progress: true
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          version: "v0.74.0"

  plan:
    name: Generate Terraform plan
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-actions-${{ github.run_id }}
          role-duration-seconds: 900

      - name: Initialize Terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Generate Terraform plan
        run: |
          umask 077
          terraform plan -input=false -lock-timeout=60s -out=tfplan

      - name: Convert and validate plan JSON
        run: |
          umask 077
          terraform show -json tfplan > plan.json
          jq -e '
            type == "object" and
            (.format_version | type == "string") and
            ((.resource_changes // []) | type == "array")
          ' plan.json > /dev/null

      - name: Remove sensitive plan files
        if: always()
        run: rm -f tfplan plan.json
